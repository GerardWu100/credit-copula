[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-copula"
version = "0.1.0"
description = "Splits the original credit copula notebook into sequential Python step scripts while preserving the original simulation logic and figures."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "scipy>=1.15",
    "nbformat>=5.10",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[project.scripts]
credit-copula = "credit_copula.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
